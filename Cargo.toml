[package]
name = "ijevim"
version = "0.1.0"
edition = "2021"
description = "A minimal Vim-like TUI editor written in Rust"
authors = ["NazoVim-org"]
license = "MIT"

[[bin]]
name = "ivim"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
ropey = "1.6"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "default-syntaxes", "default-themes"] }
mlua = { version = "0.9", features = ["lua54", "vendored"] }
rust_lisp = "0.18"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "time", "sync", "io-util"] }
thiserror = "2"
futures = "0.3"
libloading = "0.8"
clap = { version = "4", features = ["derive"] }
arboard = "3"
quickjs-rusty = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
