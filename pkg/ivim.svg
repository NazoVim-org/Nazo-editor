<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <clipPath id="left">
      <rect x="0" y="0" width="64" height="128"/>
    </clipPath>
    <clipPath id="right">
      <rect x="64" y="0" width="64" height="128"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="18" fill="#1e1e2e"/>

  <!-- iv: left half green -->
  <text x="64" y="94" font-family="monospace" font-size="72" font-weight="bold"
        fill="#a6e3a1" text-anchor="middle" clip-path="url(#left)">iv</text>

  <!-- iv: right half purple -->
  <text x="64" y="94" font-family="monospace" font-size="72" font-weight="bold"
        fill="#cba6f7" text-anchor="middle" clip-path="url(#right)">iv</text>

  <!-- center blend line -->
  <line x1="64" y1="22" x2="64" y2="106" stroke="#89dceb" stroke-width="0.5" opacity="0.4"/>
</svg>
