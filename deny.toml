# cargo-deny configuration
# Run: cargo deny check

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# vulnerability is implied (all vulnerabilities emit errors)
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
ignore = []

[licenses]
unlicensed = "deny"
allow-osi-fsf-free = "neither"
copyleft = "warn"
default = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
